[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phantom-bundler"
version = "1.0.0"
description = "Clean CLI for the Phantom Automated AI Bundler — create, stream, download, and run agent bundles."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Phantom Source-Available License v1.0" }
authors = [{ name = "Phantom Capital", email = "licensing@phantomcapital.live" }]
keywords = ["ai", "agents", "bundler", "cli", "phantom", "swarm", "llm"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Utilities",
]

# Kept minimal and aligned with the engine's requirements.txt (httpx==0.28.1).
dependencies = [
    "typer>=0.12,<1.0",
    "httpx>=0.27,<0.29",
    "rich>=13.7",
    "tomli-w>=1.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/PhantomCapAI/phantom-swarm-engine"
Repository = "https://github.com/PhantomCapAI/phantom-swarm-engine"
Issues = "https://github.com/PhantomCapAI/phantom-swarm-engine/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

# Both the primary command and a short alias resolve to the same entry point.
[project.scripts]
phantom-bundle = "phantom_bundler.cli:entrypoint"
pbundle = "phantom_bundler.cli:entrypoint"

[tool.setuptools]
packages = ["phantom_bundler"]

[tool.setuptools.package-data]
phantom_bundler = ["py.typed"]
