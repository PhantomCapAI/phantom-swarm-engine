name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile check
        run: python -m py_compile $(git ls-files '*.py')
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CLI
        run: pip install ./cli
      - name: Run CLI unit tests
        run: python -m unittest discover -s cli/phantom_bundler/tests -v
      - name: Smoke-test entry points
        run: |
          phantom-bundle --version
          pbundle --version
