name: publish-cli

# Build and publish the phantom-bundler CLI (cli/) to PyPI.
#
# Triggers on a tag like `cli-v1.0.0` (namespaced so it never collides with an
# engine release tag), or manually via the Actions tab. The tag version should
# match `version` in cli/pyproject.toml.
#
# Auth: PyPI Trusted Publishing (OIDC) — no API token stored in the repo.
# One-time setup on PyPI (see cli/RELEASING.md):
#   PyPI → the phantom-bundler project → Publishing → add a trusted publisher
#     Owner:        PhantomCapAI
#     Repository:   phantom-swarm-engine
#     Workflow:     publish-cli.yml
#     Environment:  pypi
#
# Token fallback: if you'd rather use an API token, delete the `permissions`
# block + `environment` below, add PYPI_API_TOKEN as a repo secret, and pass
# `password: ${{ secrets.PYPI_API_TOKEN }}` to the publish step.

on:
  push:
    tags:
      - "cli-v*"
  workflow_dispatch:
    inputs:
      repository:
        description: "Target index"
        default: "pypi"
        type: choice
        options: ["pypi", "testpypi"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build cli
      - name: Verify metadata
        run: |
          python -m pip install --upgrade twine
          twine check cli/dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: cli/dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Must match the environment named in the PyPI trusted-publisher config.
    environment: pypi
    permissions:
      id-token: write # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.repository == 'pypi' }}
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Publish to TestPyPI
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
